services:
  kinbooks:
    build:
      context: .
      dockerfile: Dockerfile
    image: kinbooks:latest
    container_name: kinbooks
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=8080
      - DATA_DIR=/app/data
      - DB_PATH=/app/data/kinbooks.db
      - JWT_SECRET=kinbooks-change-this-secret-key-for-security
      - TZ=Asia/Seoul
